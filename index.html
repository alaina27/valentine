<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💗</title>

<style>
body {
  background: linear-gradient(135deg, #fde2e4, #e0c3fc);
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: #fff;
  padding: 30px;
  border-radius: 25px;
  width: 330px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

img {
  width: 90px;
  margin-bottom: 10px;
}

h1 {
  color: #d63384;
}

p {
  color: #555;
}

.buttons {
  margin-top: 20px;
  position: relative;
  height: 70px;
}

button {
  padding: 12px 22px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #6c8cff;
  color: white;
  position: absolute;
  left: 180px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <img src="https://i.imgur.com/1XKz1zZ.png">
  <h1>Will you be mine? 🥺</h1>
  <p>You can’t say no 💕</p>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">YES 💗</button>
    <button id="no" onmouseover="moveNo()">NO 😈</button>
  </div>
</div>

<script>
function moveNo() {
  const noBtn = document.getElementById("no");
  const x = Math.random() * 200;
  const y = Math.random() * 40;
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

function yesClicked() {
  document.getElementById("card").innerHTML = `
    <img src="https://i.imgur.com/QkQ0R9O.png">
    <h1>YAYYY 💕</h1>
    <p>You just made me the happiest 🥹</p>
    <p>Happy Valentine’s Day 💌</p>
    <p><b>— Annu 🤍</b></p>
  `;
}
</script>

</body>
</html>
